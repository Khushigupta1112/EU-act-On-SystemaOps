name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint & Static Analysis
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff — lint
        run: ruff check . --output-format=github

      - name: Ruff — format check
        run: ruff format --check .

      - name: isort — import order
        run: isort --check-only --diff .

      - name: mypy — type checking
        run: mypy app --ignore-missing-imports --strict

  # ───────────────────────────────────────────────────────────────────────────
  # Tests with PostgreSQL service container
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: systemaops_test
          POSTGRES_USER: systemaops
          POSTGRES_PASSWORD: test_password_ci
        options: >-
          --health-cmd "pg_isready -U systemaops -d systemaops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://systemaops:test_password_ci@localhost:5432/systemaops_test
      DATABASE_URL_SYNC: postgresql+psycopg2://systemaops:test_password_ci@localhost:5432/systemaops_test
      TEST_DATABASE_URL: postgresql+asyncpg://systemaops:test_password_ci@localhost:5432/systemaops_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long!!
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install psycopg2 for Alembic
        run: pip install psycopg2-binary

      - name: Wait for PostgreSQL extensions
        run: |
          PGPASSWORD=test_password_ci psql -h localhost -U systemaops -d systemaops_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          PGPASSWORD=test_password_ci psql -h localhost -U systemaops -d systemaops_test -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"
          PGPASSWORD=test_password_ci psql -h localhost -U systemaops -d systemaops_test -c "CREATE EXTENSION IF NOT EXISTS \"citext\";"

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://systemaops:test_password_ci@localhost:5432/systemaops_test

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=junit.xml \
            -v \
            tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/junit.xml
            backend/coverage.xml

  # ───────────────────────────────────────────────────────────────────────────
  # Security Scanning
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install security tools
        run: pip install pip-audit bandit[toml] safety

      - name: pip-audit — dependency vulnerability scan
        run: pip-audit -r requirements.txt --format=json --output=pip-audit-results.json
        continue-on-error: true  # Report but don't fail on first run (baseline)

      - name: bandit — SAST scan
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-results.json \
            --exclude app/tests/
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            backend/pip-audit-results.json
            backend/bandit-results.json
